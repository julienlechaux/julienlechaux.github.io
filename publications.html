<div class="site-shell">


  <!-- Header -->

  <header class="site-header">

    <div class="header-inner">

      <a
        class="brand"
        href="index.html"
        data-site-name
      >
        Julien Lechaux
      </a>

      <nav aria-label="Main navigation">

        <a href="index.html">
          Home
        </a>

        <a
          href="publications.html"
          class="active"
        >
          Publications
        </a>

        <a href="talks.html">

        </a>

        <a

        <button
  id="theme-toggle"
  class="theme-toggle"
  type="button"
  aria-label="Toggle dark mode"
>

    <!-- Publications -->

<!-- Site data -->

<script src="site-data.js"></script>

<script src="assets/site.js"></script>



<!-- Publications data -->

<script src="publications.js"></script>


<script>

document.addEventListener("DOMContentLoaded", () => {

  const items = window.PUBLICATIONS || [];


  function renderPublication(item) {

    const links = Object.entries(item.links || {})

      .filter(([_, value]) => value && value !== "#")

      .map(([label, value]) => `
        <a href="${value}">
          ${label.toUpperCase()}
        </a>
      `)

      .join("");


    return `

      <article class="publication">

        <h3 class="publication-title">
          ${item.title}
        </h3>


        <p class="publication-meta">
          ${item.authors}
        </p>


        <p class="publication-meta">

          ${
            item.journal
            ? item.journal + " · "
            : ""
          }

          ${item.year}

          ${
            item.note
            ? " · " + item.note
            : ""
          }

        </p>


        ${
          links
          ? `<div class="pub-links">${links}</div>`
          : ""
        }

      </article>

    `;

  }


  const preprints =
    items.filter(item => item.type === "preprint");


  const publications =
    items.filter(item => item.type === "publication");


  document.getElementById("preprints").innerHTML =
    preprints.map(renderPublication).join("");


  document.getElementById("published-papers").innerHTML =
    publications.map(renderPublication).join("");

});

</script>


</body>

</html>
